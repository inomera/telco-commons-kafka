apply plugin: 'jacoco'

test {
    useJUnitPlatform()

    testLogging {
        events "skipped", "failed"
    }

    reports {
        html {
            required.set(true)
        }
    }
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    reports {
        xml {
            required.set(true)
        }
        csv {
            required.set(true)
        }
        html {
            outputLocation.set(file("${projectDir}/jacocoHtml"))
        }
    }
}
