plugins {
    id 'java-library'
}

group = 'com.inomera.telco.commons'
version = project.file('VERSION').text.trim()

ext {
    pubName = 'spring-kafka'
    pubDescription = 'Enterprise Grade Spring Boot supported Apache Kafka Java Library.'
    pubRepo = 'telco-commons-kafka'
}

apply from: "${rootProject.rootDir}/gradle/tests.gradle"
apply from: "${rootProject.rootDir}/gradle/publishing.gradle"

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    testImplementation {
        extendsFrom compileOnly
    }
}

compileJava.dependsOn(processResources)

dependencies {
    api "org.springframework:spring-core:${versions.spring}"
    api "org.springframework:spring-context:${versions.spring}"
    api "com.inomera.telco.commons:lang:${versions.lang}"
    api "org.apache.kafka:kafka-clients:${versions.kafka_clients}"
    // @Nullable appears in public signatures (e.g. ProducerFactory), so declare it rather than
    // relying on spring-core pulling it in transitively.
    api "org.jspecify:jspecify:${versions.jspecify}"

    implementation "org.apache.commons:commons-lang3:${versions.commons_lang3}"
    implementation "org.slf4j:slf4j-api:${versions.slf4j}"

    compileOnly "org.projectlombok:lombok:${versions.lombok}"
    annotationProcessor "org.projectlombok:lombok:${versions.lombok}"
    testAnnotationProcessor "org.projectlombok:lombok:${versions.lombok}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${versions.jupiter}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${versions.jupiter}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${versions.jupiter}"
    testImplementation "org.mockito:mockito-core:${versions.mockito_core}"
    testImplementation "org.mockito:mockito-junit-jupiter:${versions.mockito_jupiter}"
    testImplementation "org.hamcrest:hamcrest:${versions.hamcrest}"
}
